<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Match MVP</title>
  <link rel="stylesheet" href="mvp.css">
</head>
<body onload="loadMVP()">

<div class="poster">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <img src="assets/managing-partner.png" class="header-logo">
      <div class="header-divider"></div>
      <img src="assets/presentedby.png" class="header-logo">
    </div>

    <div class="header-center">
      <img src="assets/asia.png" class="asia-logo">
      <h1 class="mvp-heading">MVP</h1>
      <!-- <div class="mvp-sub-badge">RANKING</div> -->
    </div>

    <div class="header-right">
      <!-- <img src="assets/platform-partner.png" class="header-logo-right"> -->
    </div>
  </div>

  <!-- MVP CARDS SECTION -->
  <div class="mvp-section">
    <div class="mvp-cards-row">

      <!-- #1 -->
      <div class="mvp-card-wrap rank-1">
        <div class="rank-badge">#1</div>
        <div class="player-img-wrap">
          <img src="assets/1.png" alt="1st" class="player-img">
        </div>
        <div class="mvp-card" id="mvp1">
          <div class="card-info">
            <div class="kills-line">KILLS: <span class="kills-val">0</span></div>
            <div class="ign-line">IGN: <span class="ign-val">—</span></div>
            <div class="team-line">TEAM NAME: <span class="team-val">—</span></div>
          </div>
        </div>
      </div>

      <!-- #2 -->
      <div class="mvp-card-wrap rank-2">
        <div class="rank-badge">#2</div>
        <div class="player-img-wrap">
          <img src="assets/2.png" alt="2nd" class="player-img">
        </div>
        <div class="mvp-card" id="mvp2">
          <div class="card-info">
            <div class="kills-line">KILLS: <span class="kills-val">0</span></div>
            <div class="ign-line">IGN: <span class="ign-val">—</span></div>
            <div class="team-line">TEAM NAME: <span class="team-val">—</span></div>
          </div>
        </div>
      </div>

      <!-- #3 -->
      <div class="mvp-card-wrap rank-3">
        <div class="rank-badge">#3</div>
        <div class="player-img-wrap">
          <img src="assets/3.png" alt="3rd" class="player-img">
        </div>
        <div class="mvp-card" id="mvp3">
          <div class="card-info">
            <div class="kills-line">KILLS: <span class="kills-val">0</span></div>
            <div class="ign-line">IGN: <span class="ign-val">—</span></div>
            <div class="team-line">TEAM NAME: <span class="team-val">—</span></div>
          </div>
        </div>
      </div>

    </div>
  </div>
